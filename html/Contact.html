<!DOCTYPE html>
<html>
    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Caleb Lui">
        <title>COCTRPG Contact Page</title>
        <link rel="stylesheet" href="../css/Contact.css">
        <link rel="stylesheet" href="../css/Option.css">

    </head>


    <body>
        
        <div id="site-nav"></div>
        
        
        <img id="background" src="../resource/ContactBG.jpg">
        
        
        <section id="contact">
            <div id="intro">
                <h2>Contact Us</h2>
                <p>If you have any question about the game. You are free to get us in touch
                    We will be happy to accept more new player or keeper! 
                </p>
            </div>

            <div id="main-content">
                
                <div id="namecard">

                    <div class="box">
                        <div class="icon"><img src="../resource/placeholder.png"></div>
                        <div class="text">
                            <h3>Address</h3>
                            <p>133 Shing Tai Road,<br>Chai Wan, Hong Kong</p>
                        </div>
                    </div>

                    <div class="box">
                        <div class="icon"><img src="../resource/telephone.png"></div>
                        <div class="text">
                            <h3>Phone</h3>
                            <p>+852-3890-8026</p>
                        </div>
                    </div>

                    <div class="box">
                        <div class="icon"><img src="../resource/arroba.png"></div>
                        <div class="text">
                            <h3>Email</h3>
                            <p>COCTRPG@gmail.com</p>
                        </div>
                    </div>

                </div>
            
            
                <form>
                    <h2>Send Message</h2>

                    <div class="inputbox">
                        <input type="text" name="" required="required" placeholder=" ">
                        <span>Name</span>
                    </div>

                    <div class="inputbox">
                        <input type="email" name="" required="required" placeholder=" ">
                        <span>Email</span>
                    </div>

                    <div class="inputbox">
                        <textarea required="required" placeholder=" "></textarea>
                        <span>Type your Message</span>
                    </div>

                    <div class="inputbox">
                        <input type="submit" name="" value="Send">
                    </div>


                </form>

            </div>

        </section>


    <script src="../js/common.js"></script>
    </body>
</html>
